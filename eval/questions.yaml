# Retrieval evaluation set: question -> passages that answer it.
#
# A retrieved chunk is relevant to a passage when its file name contains `file` and its text contains
# `contains` (case, whitespace and " | " column separators ignored). Matching on text rather than chunk
# ids keeps the set valid when chunking changes. Recall@k = share of a question's passages found in the
# top k; MRR uses the rank of the first relevant chunk.
#
# Questions are phrased the way a bid analyst would ask, often with different words from the document
# ("deadline" vs "Solicitation Due"), so the set tests more than keyword overlap.

- id: q01
  bid: Bid1
  question: What is the final submission deadline for proposals?
  relevant:
